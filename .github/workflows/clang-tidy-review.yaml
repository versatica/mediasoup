name: clang-tidy-review

# It currently only works on pull requests.
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install invoke.
      - name: pip3 install --break-system-packages invoke
        run: pip3 install --break-system-packages invoke

      - name: invoke -r worker mediasoup-worker
        run: invoke -r worker mediasoup-worker

      - name: set mediasoup source files
        run: |
          # Define the depth.
          DEPTH=5

          # Initialize the variables.
          HPP_FILES="include/*.hpp"
          CPP_FILES="src/*.cpp"

          # Generate the string for the given depth.
          for ((i=1; i<=DEPTH; i++)); do
            HPP_PATTERN="include/"$(printf "**/"%.0s $(seq 1 $i))"*.hpp"
            HPP_FILES="$HPP_FILES,$HPP_PATTERN"

            CPP_PATTERN="src/"$(printf "**/"%.0s $(seq 1 $i))"*.cpp"
            CPP_FILES="$CPP_FILES,$CPP_PATTERN"
          done

          # Export the result as an environment variables.
          echo "HPP_FILES=$HPP_FILES" >> $GITHUB_ENV
          echo "CPP_FILES=$CPP_FILES" >> $GITHUB_ENV

      - uses: ZedThree/clang-tidy-review@v0.22.1
        id: review
        with:
          build_dir: 'worker/out/Release/build/'
          base_dir: '${{ github.workspace }}/worker'
          clang_tidy_version: '21'
          include: '${{ env.HPP_FILES }},${{ env.CPP_FILES }}'

      # Uploads an artifact containing clang_fixes.json.
      - uses: ZedThree/clang-tidy-review/upload@v0.22.1
        id: upload-review

      # If there are any comments, fail the check.
      - if: steps.review.outputs.total_comments > 0
        run: exit 1
