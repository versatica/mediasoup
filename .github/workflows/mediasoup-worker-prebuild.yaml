name: mediasoup-worker-prebuild

# Triggered when `mediasoup-npm-publish.yaml` finishes successfully (`workflow_run`).
# It builds the mediasoup-worker prebuilt binaries for all supported platforms
# and uploads them to the GitHub release that `mediasoup-npm-publish.yaml` already
# created.
#
# It can also be triggered manually (`workflow_dispatch`) to re-build and re-upload
# the prebuilt binaries for a given release tag (for example if a platform
# failed), by entering the release tag/version in the GitHub Actions tab.
on:
  workflow_run:
    workflows: ['mediasoup-npm-publish']
    # `workflow_run` can fire on different activity types of the upstream run:
    #   - requested: the upstream run was created/queued.
    #   - in_progress: the upstream run started executing.
    #   - completed: the upstream run finished, with ANY conclusion (success,
    #     failure, cancelled, skipped, timed_out, action_required, ...).
    # We want 'completed' because that's the only activity type that fires once
    # the upstream run has fully finished. The conclusion is then gated in the
    # job's `if` below, so we only build the prebuilt binaries when the NPM
    # publish actually succeeded.
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to (re)build and upload mediasoup-worker prebuilt binaries'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.event.workflow_run.head_branch }}
  # Don't cancel an in-progress prebuild if a new run lands in the same group.
  cancel-in-progress: false

jobs:
  # Build the mediasoup-worker prebuilt binaries and upload them to the GH
  # release.
  prebuild:
    # Run only when triggered manually, or when the upstream `mediasoup-npm-publish`
    # run finished successfully. This guarantees we never build/upload binaries
    # for a release whose NPM publish failed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    strategy:
      # Here we want to see all errors, not just the first one.
      fail-fast: false
      matrix:
        build:
          # Worker prebuild for Linux hosts with kernel version 6, built on
          # Ubuntu 22.04.
          #
          # Let's use Ubuntu 22.04 instead of 24.04 so that it builds the
          # mediasoup-worker binary against an old version of glibc (and
          # libstdc++) that will also work on Linux hosts running more modern
          # glibc versions.
          #
          # This is needed because glibc uses symbol versioning: the linker
          # records the newest version tag available on the *build* host for
          # each symbol used (i.e. `pthread_create@GLIBC_2.34`), and at load
          # time the dynamic linker requires the host glibc to provide those
          # version nodes. glibc is backwards compatible (a binary built
          # against an old glibc runs on newer ones) but not forwards
          # compatible, so we must build against the oldest glibc we want to
          # support. Otherwise the binary fails to even start with errors like
          # "version `GLIBC_2.33' not found".
          #
          # See https://github.com/versatica/mediasoup/issues/1089.
          - os: ubuntu-22.04
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04-arm
            cc: gcc
            cxx: g++
          # Worker prebuild for Linux hosts with kernel version 7, built on
          # Ubuntu 26.04.
          #
          # A separate build is needed because prebuilt tarballs are named
          # after the kernel major version of the build host (see
          # `getWorkerPrebuildTarName()` in npm-scripts.mjs), so hosts running
          # a kernel 7 look for a different tarball than those running a
          # kernel 6.
          - os: ubuntu-26.04
            cc: gcc
            cxx: g++
          - os: ubuntu-26.04-arm
            cc: gcc
            cxx: g++
          # Worker prebuild for musl based Linux hosts (Alpine Linux), kernel
          # version 6 and 7, for x64 and arm64.
          #
          # A binary linked against glibc does not run on musl, so these are
          # separate builds whose tarball name carries a `-musl` suffix (see
          # `getWorkerPrebuildTarName()` in npm-scripts.mjs). They are compiled
          # inside the official node:22-alpine Docker image: the runner's own
          # Node.js (glibc) cannot execute inside an Alpine job container, so a
          # plain `docker run` is used instead of `container:`. The kernel
          # major version in the name is the runner's, as for the glibc builds.
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
            musl: true
          - os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
            musl: true
          - os: ubuntu-26.04
            cc: gcc
            cxx: g++
            musl: true
          - os: ubuntu-26.04-arm
            cc: gcc
            cxx: g++
            musl: true
          - os: macos-15
            cc: clang
            cxx: clang++
          - os: windows-2025
            cc: cl
            cxx: cl

    runs-on: ${{ matrix.build.os }}

    timeout-minutes: 90

    env:
      CC: ${{ matrix.build.cc }}
      CXX: ${{ matrix.build.cxx }}
      MEDIASOUP_SKIP_WORKER_PREBUILT_DOWNLOAD: 'true'
      MEDIASOUP_LOCAL_DEV: 'true'
      MEDIASOUP_BUILDTYPE: 'Release'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}

      - name: Node.js
        if: ${{ !matrix.build.musl }}
        uses: actions/setup-node@v6
        with:
          node-version: 26

      # We need to install some NPM production deps for npm-scripts.mjs to work.
      - name: npm ci --ignore-scripts --omit=dev --foreground-scripts
        if: ${{ !matrix.build.musl }}
        run: npm ci --ignore-scripts --omit=dev --foreground-scripts

      - name: npm run worker:prebuild-name
        if: ${{ !matrix.build.musl }}
        run: npm run worker:prebuild-name

      - name: npm run worker:build
        if: ${{ !matrix.build.musl }}
        run: npm run worker:build

      - name: npm run worker:prebuild
        if: ${{ !matrix.build.musl }}
        run: npm run worker:prebuild

      # musl: same steps, run inside the Alpine based Node.js image so the
      # worker links against musl. The resulting tarball is owned by root, so
      # give it back to the runner user for the upload step.
      - name: Build mediasoup-worker inside node:22-alpine (musl)
        if: ${{ matrix.build.musl }}
        run: |
          docker run --rm -v "$PWD:/mediasoup" -w /mediasoup \
            -e CC -e CXX \
            -e MEDIASOUP_SKIP_WORKER_PREBUILT_DOWNLOAD -e MEDIASOUP_LOCAL_DEV -e MEDIASOUP_BUILDTYPE \
            node:22-alpine sh -euc '
              apk add --no-cache python3 py3-pip make g++ linux-headers
              npm ci --ignore-scripts --omit=dev --foreground-scripts
              npm run worker:prebuild-name
              npm run worker:build
              npm run worker:prebuild
              chown -R "$(stat -c %u:%g package.json)" worker/prebuild
            '

      - name: Upload mediasoup-worker prebuilt binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
          files: worker/prebuild/mediasoup-worker-*.tgz
