name: mediasoup-worker-fuzzer

on:
  push:
    branches: [v3]
    paths:
      - 'worker/**'
      - '!worker/package.json'
      - '!worker/package-lock.json'
      - '.github/workflows/mediasoup-worker-fuzzer.yaml'
  pull_request:
    paths:
      - 'worker/**'
      - '!worker/scripts/package.json'
      - '!worker/scripts/package-lock.json'
      - '.github/workflows/mediasoup-worker-fuzzer.yaml'
  workflow_dispatch:

concurrency:
  # Cancel a currently running workflow from the same PR, branch or tag when a
  # new workflow is triggered.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The `release` and `release:rust` npm scripts push a version-bump commit whose
  # message carries a `[no-ci]` marker, which skips the `ci` job below. A run
  # whose jobs are all skipped concludes as "skipped", which GitHub renders as a
  # red "failing" status badge. This tiny job runs ONLY on those commits so the
  # run concludes as "success" -> the branch badge stays green. On any other
  # event it is skipped and `ci` alone drives the result.
  no-ci-badge-guard:
    if: ${{ contains(github.event.head_commit.message, '[no-ci]') }}
    runs-on: ubuntu-26.04
    steps:
      - run: 'true'

  ci:
    # Skip the release commit pushed by `npm run release` (its message carries a
    # `[no-ci]` marker): it only bumps version/CHANGELOG and the release is
    # driven by the tag-triggered workflows. On `pull_request` there is no
    # `head_commit`, so the guard is a no-op and the job runs.
    if: ${{ !contains(github.event.head_commit.message, '[no-ci]') }}
    strategy:
      matrix:
        build:
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
            pip-break-system-packages: true
          - os: ubuntu-26.04
            cc: clang
            cxx: clang++
            pip-break-system-packages: true
          - os: ubuntu-26.04-arm
            cc: clang
            cxx: clang++
            pip-break-system-packages: true
        build-type:
          - Release
          - Debug

    runs-on: ${{ matrix.build.os }}

    timeout-minutes: 60

    env:
      CC: ${{ matrix.build.cc }}
      CXX: ${{ matrix.build.cxx }}
      MEDIASOUP_SKIP_WORKER_PREBUILT_DOWNLOAD: 'true'
      MEDIASOUP_LOCAL_DEV: 'true'
      MEDIASOUP_BUILDTYPE: ${{ matrix.build-type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # We need to install pip invoke manually.
      - if: ${{ !matrix.build.pip-break-system-packages }}
        name: pip3 install invoke
        run: pip3 install invoke

      # In modern OSs we need to run pip with this option.
      - if: ${{ matrix.build.pip-break-system-packages }}
        name: pip3 install --break-system-packages invoke
        run: pip3 install --break-system-packages invoke

      # Build the mediasoup-worker-fuzzer binary (which uses libFuzzer).
      - name: invoke -r worker fuzzer
        run: invoke -r worker fuzzer

      # Run mediasoup-worker-fuzzer for 5 minutes.
      - name: run-fuzzer.sh 300
        run: cd worker && ./scripts/run-fuzzer.sh 300
