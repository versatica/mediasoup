name: mediasoup-worker-clang-tidy

on:
  pull_request:
    paths:
      - 'worker/src/**/*.cpp'
      - 'worker/include/**/*.hpp'
      - 'worker/test/src/**/*.cpp'
      - 'worker/test/include/**/*.hpp'
      - 'worker/fuzzer/src/**/*.cpp'
      - 'worker/fuzzer/include/**/*.hpp'
      - 'worker/mocks/src/**/*.cpp'
      - 'worker/mocks/include/**/*.hpp'
      - 'worker/meson.build'
      - 'worker/tasks.py'
      - 'worker/.clang-format'
      - 'worker/.clang-tidy'
      - 'worker/subprojects/.clang-tidy'
      - 'worker/scripts/clang-scripts.mjs'
      - 'worker/scripts/package.json'
      - 'worker/scripts/package-lock.json'
      - '.github/workflows/mediasoup-worker-clang-tidy.yaml'

concurrency:
  # Cancel a currently running workflow from the same PR, branch or tag when a
  # new workflow is triggered.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: pip3 install --break-system-packages invoke

      - name: Install NPM worker development tools
        run: npm ci --prefix worker/scripts --foreground-scripts

      - name: Setup Meson build (generates compile_commands.json)
        working-directory: worker
        run: invoke tidy-normalize-compile-commands

      - uses: ZedThree/clang-tidy-review@v0.23.1
        id: review
        with:
          # The action's image does not ship clang-tidy 23, so it is installed
          # from apt.llvm.org.
          apt_packages: 'ca-certificates,curl,gpg'
          install_commands: 'curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg && echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/questing/ llvm-toolchain-questing main" > /etc/apt/sources.list.d/llvm.list && apt-get update && apt-get install -y --no-install-recommends clang-tidy-23 libclang-rt-23-dev'
          build_dir: 'worker/out/Release/build-test'
          config_file: 'worker/.clang-tidy'
          clang_tidy_version: '23'
          lgtm_comment_body: ''
          extra_arguments: --quiet
          include: 'worker/src/**/*.cpp,worker/test/src/**/*.cpp,worker/fuzzer/src/**/*.cpp'

      # Uploads an artifact containing clang_fixes.json.
      - uses: ZedThree/clang-tidy-review/upload@v0.23.1
        id: upload-review

      # If there are any comments, something went wrong so fail the check.
      - if: steps.review.outputs.total_comments > 0
        run: exit 1
